<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4338ca" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trường Học Số" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Trường Học Số - Hệ thống quản lý công việc giáo viên</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      window.addEventListener('error', function(e) {
        // Nếu lỗi là do không tìm thấy file giao diện (JS/CSS) cũ do kẹt cache
        if (
          e.message && 
          (e.message.includes('Loading chunk') || 
           e.message.includes('Failed to fetch dynamically imported module') ||
           e.message.includes('Unexpected token'))
        ) {
          console.warn('Phát hiện bản cập nhật mới bị kẹt cache. Đang tự động tải lại...');
          // Ép trình duyệt tải lại trang ngay lập tức để lấy bản code mới nhất
          window.location.reload(true);
        }
      }, true);
    </script>
  </body>
</html>
